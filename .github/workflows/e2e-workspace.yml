name: e2e-workspace

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  workspace-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run workspace E2E
        working-directory: frontend
        run: npm run e2e -- tests/e2e/workspace-copilot.spec.ts tests/e2e/provider-routing.spec.ts tests/e2e/ollama-local-only.spec.ts tests/e2e/knowledge-ingest.spec.ts

      - name: Preserve failed workspace diagnostics
        if: failure()
        run: |
          mkdir -p workspace-e2e-logs
          cp .runtime_logs/*.log workspace-e2e-logs/ 2>/dev/null || true

      - name: Upload failed workspace diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-e2e-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
            workspace-e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
