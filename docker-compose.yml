services:
  backend:
    build: ./backend
    container_name: lab_knowledge_backend
    restart: always
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    ports:
      - "5003:5003"
    environment:
      - FLASK_CONFIG=production
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - FLASK_APP=run.py
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  backend_v2:
    build:
      context: ./backend
      dockerfile: Dockerfile.v2
    container_name: lab_knowledge_backend_v2
    restart: always
    volumes:
      - ./backend:/app
      - backend_v2_data:/app/instance
    ports:
      - "8003:8003"
    environment:
      - V2_PORT=8003
      - V2_DATABASE_URL=sqlite+pysqlite:////app/instance/data-v2.sqlite
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: lab_knowledge_frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      backend_v2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend_data:
  backend_v2_data:
